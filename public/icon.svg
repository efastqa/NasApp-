<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A0A0B" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FFB0" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="#39FFB0" stroke-opacity="0.25" stroke-width="6" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#39FFB0" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="410" cy="100" r="14" fill="#39FFB0" opacity="0.9" filter="url(#glow)" />
  <circle cx="102" cy="412" r="8" fill="#39FFB0" opacity="0.6" />

  <!-- Stylized "N" Monogram for NasApp -->
  <g filter="url(#glow)">
    <path d="M140 372 V140 H180 L332 372 H372 V140 H332" fill="none" stroke="url(#brandGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="140" cy="140" r="20" fill="#39FFB0" />
    <circle cx="372" cy="372" r="20" fill="#39FFB0" />
  </g>
</svg>
